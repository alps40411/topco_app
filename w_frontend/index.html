<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI週報</title>

    <!-- 預先連線到後端 API，減少首次請求延遲 -->
    <script>
      // 動態設置 API 預連線
      (function () {
        const isDev =
          window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1";
        const protocol = window.location.protocol;
        const hostname = window.location.hostname;
        const apiUrl = isDev
          ? "http://localhost:8001"
          : `${protocol}//${hostname}:8001`;

        // Preconnect
        const preconnect = document.createElement("link");
        preconnect.rel = "preconnect";
        preconnect.href = apiUrl;
        preconnect.crossOrigin = "anonymous";
        document.head.appendChild(preconnect);

        // DNS Prefetch
        const dnsPrefetch = document.createElement("link");
        dnsPrefetch.rel = "dns-prefetch";
        dnsPrefetch.href = apiUrl;
        document.head.appendChild(dnsPrefetch);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 部署新版後，舊快取的 index.html 會引用已不存在的 JS bundle
      // 偵測載入失敗時自動重新整理一次（避免無限迴圈）
      window.addEventListener('error', function (e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var reloaded = sessionStorage.getItem('cache_reload');
          if (!reloaded) {
            sessionStorage.setItem('cache_reload', '1');
            window.location.reload(true);
          }
        }
      }, true);
      window.addEventListener('load', function () {
        sessionStorage.removeItem('cache_reload');
      });
    </script>
  </body>
</html>
